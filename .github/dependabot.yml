# Dependabot — weekly pull requests into dev for npm packages (minor and patch updates grouped into one, majors on
# their own) and for the actions the workflows use (which are pinned to commits; Dependabot moves the pin and the
# version comment together). Security updates arrive as soon as an advisory does, regardless of the schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Colombo
    open-pull-requests-limit: 5
    # a version has to be a week old before it's proposed — most compromised releases are pulled within days
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # the Node types follow the Node the site runs on (24 on Vercel, 24 in CI) — a new major here is a decision, not an update
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 isn't supported by typescript-eslint yet ("typescript-eslint does not support TS 7.0"); lift this when it is
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Colombo
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
