# Every push to main and every pull request: lint, types, a production build, the whole Playwright suite (every
# route, section and viewport — see README "Tests") split across two machines, and Lighthouse on the main pages so
# nothing quietly gets slower, less accessible or worse for search. The three jobs run side by side; a newer push to
# the same branch cancels the run in progress.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Lint, types, build, tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # next-env.d.ts and the route types (PageProps, LayoutProps, image imports) are generated, not committed
      - name: Types
        run: npx next typegen && npx tsc --noEmit

      # next/font downloads every configured Google font at build time; a download that times out on the runner fails
      # the build, so a failed build gets one more go before the run is called red
      - name: Production build
        run: npm run build || { echo "::warning::Build failed (often a Google Fonts download timing out) — retrying once"; npm run build; }

      - name: Install Chromium for the tests
        run: npx playwright install --with-deps chromium

      # serves the build itself (playwright.config.ts) with the reveal gate as in production; the tests carry the
      # preview cookie
      - name: End-to-end tests
        run: npx playwright test --shard=${{ matrix.shard }}/2
        env:
          CI: "true"

      - name: Keep the test report, traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: test-results
          retention-days: 7

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Production build
        run: npm run build || { echo "::warning::Build failed (often a Google Fonts download timing out) — retrying once"; npm run build; }

      # Lighthouse drives the same Chromium build as the tests: the runner's own, newest Chrome times out on its
      # DevTools calls
      - name: Install Chromium for Lighthouse
        run: npx playwright install --with-deps chromium

      # mobile Lighthouse (simulated slow 4G, 4x slower CPU), three runs per page, against the build with the reveal
      # gate off; the thresholds are in lighthouserc.json
      - name: Lighthouse
        run: CHROME_PATH="$(node -p "require('playwright-core').chromium.executablePath()")" npx --yes @lhci/cli@0.15.1 autorun
        env:
          REVEAL_GATE: "off"

      - name: Keep the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: .lighthouseci
          include-hidden-files: true # the folder's name starts with a dot
          retention-days: 14
