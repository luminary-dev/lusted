# Every push to dev or main and every pull request: lint, types, a production build and the whole Playwright suite
# (every route, section and viewport — see README "Tests") split across four machines; on pull requests into main and
# on main, Lighthouse on the main pages too, so nothing quietly gets slower, less accessible or worse for search. The
# jobs run side by side; a newer push to the same branch cancels the run in progress.
#
# Branches and deploys (README "Deploy"):
#   dev  — every push that passes deploys a Vercel preview and moves lusted-dev.vercel.app onto it (gate off there)
#   main — production, lusted.vercel.app; deploys only when the push is a merge of dev, and a pull request into main
#          from any branch other than dev fails its checks
# The deploy jobs need VERCEL_TOKEN (any scope: a team-scoped token is fine, the commands below avoid the CLI's
# identity call), VERCEL_ORG_ID (the team id) and VERCEL_PROJECT_ID in the repository's secrets.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # main only takes merges from dev: a pull request into main from anywhere else goes red here
  branch-rules:
    name: Branch rules
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Only dev may be merged into main
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::Pull requests into main must come from dev (this one is from '${{ github.head_ref }}')."
            exit 1
          fi
          echo "From dev — fine."

  tests:
    name: Lint, types, build, tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Next.js keeps its compiler and image cache in .next/cache; restored from the last run on this lockfile,
      # topped up by any older one, the build takes a fraction of the time
      - name: Restore the Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Lint
        run: npm run lint

      # next-env.d.ts and the route types (PageProps, LayoutProps, image imports) are generated, not committed
      - name: Types
        run: npx next typegen && npx tsc --noEmit

      # next/font downloads every configured Google font at build time; a download that times out on the runner fails
      # the build, so a failed build gets one more go before the run is called red
      - name: Production build
        run: npm run build || { echo "::warning::Build failed (often a Google Fonts download timing out) — retrying once"; npm run build; }

      # the browser download is the step that varies most from run to run (seconds to minutes); keep it per Playwright version
      - name: Restore Playwright's Chromium
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium for the tests
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium's system libraries
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # serves the build itself (playwright.config.ts) with the reveal gate as in production; the tests carry the
      # preview cookie
      - name: End-to-end tests
        run: npx playwright test --shard=${{ matrix.shard }}/4
        env:
          CI: "true"

      - name: Keep the test report, traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: test-results
          retention-days: 7

  # Lighthouse runs where it decides something: on a pull request into main and on main itself. A push to dev gets
  # the fast path (lint, types, build, tests, deploy) — run it locally there when you want the numbers.
  lighthouse:
    name: Lighthouse
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore the Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Production build
        run: npm run build || { echo "::warning::Build failed (often a Google Fonts download timing out) — retrying once"; npm run build; }

      # Lighthouse drives the same Chromium build as the tests: the runner's own, newest Chrome times out on its
      # DevTools calls
      - name: Restore Playwright's Chromium
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium for Lighthouse
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium's system libraries
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # mobile Lighthouse (simulated slow 4G, 4x slower CPU), three runs per page, against the build with the reveal
      # gate off; the thresholds are in lighthouserc.json. Like the tests, it runs the browser without WebGL
      # (lighthouserc.json chromeFlags): the runner has no GPU, so the cursor smoke and the 3D size tags would be
      # software-rendered and the numbers would swing from run to run. The server is started here and every page
      # fetched twice first, so the first measured run isn't also the server's cold start (that alone read 3.9 s of
      # blocking time once); blocking time and layout shift are then judged by their best of the three runs
      # (lighthouserc.json "optimistic") — a real regression shows in every run, a runner hiccup in one.
      - name: Lighthouse
        run: |
          REVEAL_GATE=off npx next start -p 3200 > lighthouse-server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3200/ && break; sleep 1; done
          for u in / /products /products/rose-lace-balconette-bra /about /help; do
            curl -sf -o /dev/null "http://localhost:3200$u" && curl -sf -o /dev/null "http://localhost:3200$u" || { echo "::error::$u did not answer"; exit 1; }
          done
          CHROME_PATH="$(node -p "require('playwright-core').chromium.executablePath()")" npx --yes @lhci/cli@0.15.1 autorun

      - name: Keep the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: .lighthouseci
          include-hidden-files: true # the folder's name starts with a dot
          retention-days: 14

  # dev → a preview on Vercel, and lusted-dev.vercel.app moved onto it; main → production, only for a merge of dev.
  # Deploys never cancel each other and run one at a time per branch, after the tests have passed — and Lighthouse
  # too on main (on dev it doesn't run, and a skipped job must not hold the deploy back: hence always()).
  deploy:
    name: Deploy (${{ github.ref_name }})
    if: >-
      always() && github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
      && needs.tests.result == 'success' && (needs.lighthouse.result == 'success' || needs.lighthouse.result == 'skipped')
    needs: [tests, lighthouse]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the merge check below reads the commit's parents

      - name: Check the Vercel secrets are there
        run: |
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret $v is not set (Settings → Secrets → Actions)."; exit 1; fi
          done

      # production only ever comes from dev: the commit on main must be a merge whose second parent is on dev
      - name: Production deploys only from a merge of dev
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch origin dev --quiet || { echo "::error::There is no dev branch to merge from."; exit 1; }
          if [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -lt 3 ]; then
            echo "::error::This push to main is not a merge commit. Merge dev into main instead of pushing to main directly."
            exit 1
          fi
          second="$(git rev-list --parents -n 1 HEAD | cut -d' ' -f3)"
          if ! git merge-base --is-ancestor "$second" origin/dev; then
            echo "::error::This merge did not come from dev (its second parent is not on dev). Only dev is merged into main."
            exit 1
          fi
          echo "A merge of dev — deploying to production."

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Vercel builds the deployment itself from the source (so its build cache and image optimiser settings apply).
      # The CLI finds the project through VERCEL_ORG_ID and VERCEL_PROJECT_ID; it is not given --scope, because a
      # team-scoped token cannot answer the "load user" call that --scope (and `vercel alias`) make — the alias is set
      # through the REST API instead, which takes the team id directly.
      - name: Deploy a preview and move lusted-dev.vercel.app onto it
        if: github.ref == 'refs/heads/dev'
        run: |
          # the deployment's own address (lusted-<hash>-<team>.vercel.app) — never lusted-dev or lusted.vercel.app, which the
          # CLI also prints in its hints
          url="$(npx --yes vercel@latest deploy --yes --token "$VERCEL_TOKEN" 2>&1 | tee /dev/stderr | grep -oE 'https://lusted-[a-z0-9]{6,}-[a-z0-9-]+\.vercel\.app' | head -1)"
          [ -n "$url" ] || { echo "::error::Could not read the preview deployment's URL from the Vercel CLI output."; exit 1; }
          host="${url#https://}"
          id="$(curl -sS "https://api.vercel.com/v13/deployments/$host?teamId=$VERCEL_ORG_ID" -H "Authorization: Bearer $VERCEL_TOKEN" | jq -r '.id // empty')"
          [ -n "$id" ] || { echo "::error::Vercel has no deployment at $host."; exit 1; }
          res="$(curl -sS -X POST "https://api.vercel.com/v2/deployments/$id/aliases?teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
            -d '{"alias":"lusted-dev.vercel.app"}')"
          echo "$res"
          [ "$(echo "$res" | jq -r '.alias // empty')" = "lusted-dev.vercel.app" ] || { echo "::error::Vercel did not move lusted-dev.vercel.app onto $host."; exit 1; }
          echo "lusted-dev.vercel.app → $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to production
        if: github.ref == 'refs/heads/main'
        run: |
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
          echo "lusted.vercel.app ← $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
