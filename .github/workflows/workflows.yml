# The workflows themselves, and the history: actionlint checks every workflow file for mistakes (bad expressions,
# unknown runners, shell errors), zizmor for security weaknesses (template injection, credential persistence,
# over-broad permissions, unpinned actions, cache poisoning), and gitleaks checks the pushed commits for secrets that
# GitHub's own scanning might not have a pattern for. Required by the rulesets.
name: Workflows

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # zizmor's findings go to code scanning too
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2

      - name: zizmor
        uses: zizmorcore/zizmor-action@3aa7e2f1ad15075829ef5158ee06938ae12e1769 # v0.4.0
        with:
          min-severity: low
          min-confidence: medium

  secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # gitleaks reads the commits, not just the tree
          persist-credentials: false

      # on a pull request only its commits are scanned; on a push, the whole history
      - name: gitleaks
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="--log-opts=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            range=""
          fi
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner --exit-code 1 $range
